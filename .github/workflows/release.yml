name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Required for OIDC

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm build:napi --target x86_64-apple-darwin
          - host: windows-latest
            build: pnpm build:napi --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build:napi --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm build:napi --target x86_64-unknown-linux-musl -x
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build:napi --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build:napi --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm build:napi --target aarch64-unknown-linux-musl -x
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build:napi --target aarch64-pc-windows-msvc

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: packages/sheetkit

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            x86_64-apple-darwin,
            aarch64-apple-darwin,
            x86_64-pc-windows-msvc,
            aarch64-pc-windows-msvc,
            x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-gnu,
            x86_64-unknown-linux-musl,
            aarch64-unknown-linux-musl

      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: 'packages/sheetkit/sheetkit.*.node'
          if-no-files-found: error

  publish:
    name: Publish
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sheetkit-zip version
        run: |
          workspace=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sheetkit-core") | .version')
          requirement=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sheetkit-core")
              | .dependencies[] | select(.name == "sheetkit-zip") | .req')
          fork=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path vendor/zip/Cargo.toml | jq -r '.packages[0].version')
          echo "workspace=$workspace fork=$fork requirement=$requirement"
          if [ "$fork" != "$workspace" ] || [ "$requirement" != "=$workspace" ]; then
            echo "::error::sheetkit-zip must be $workspace and pinned as =$workspace"
            exit 1
          fi

      - name: Build JS wrapper
        working-directory: packages/sheetkit
        run: pnpm build

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: packages/sheetkit/artifacts

      - name: Move artifacts
        working-directory: packages/sheetkit
        run: >-
          pnpm exec napi artifacts --cwd ../..
          --package-json-path packages/sheetkit/package.json
          --output-dir packages/sheetkit/artifacts
          --npm-dir packages

      - name: Validate npm packages
        working-directory: packages/sheetkit
        run: >-
          pnpm exec napi prepublish -t npm --cwd ../..
          --package-json-path packages/sheetkit/package.json
          --npm-dir packages --skip-optional-publish --no-gh-release --dry-run

      - name: Publish packages to npm
        working-directory: packages/sheetkit
        run: pnpm publish --access public --provenance --no-git-checks --recursive

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      # One cargo publish packages every crate, sheetkit-zip included, against
      # the local copies, so it does not depend on the index catching up.
      # Crates already on crates.io are skipped so a rerun uploads the rest.
      - name: Publish to crates.io
        run: |
          packages=()
          while read -r name version; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'sheetkit-release (https://github.com/Nebu1eto/sheetkit)' \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version already exists; skipping" ;;
              404) packages+=(--package "$name") ;;
              *) echo "::error::crates.io lookup for $name returned HTTP $status"; exit 1 ;;
            esac
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          if [ ${#packages[@]} -eq 0 ]; then
            echo "All workspace crates are already published"
          else
            cargo publish "${packages[@]}" --allow-dirty
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
