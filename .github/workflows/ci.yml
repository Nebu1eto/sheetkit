name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace && cargo build -p sheetkit --features cli

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings && cargo clippy -p sheetkit --features cli -- -D warnings

      - name: Clippy vendored ZIP fork
        run: cargo clippy --manifest-path vendor/zip/Cargo.toml --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Test encryption features
        run: |
          cargo test --workspace --features sheetkit-core/encryption
          cargo test -p sheetkit --features encryption

      - name: Test CLI
        run: cargo test -p sheetkit --features cli

      - name: Test vendored ZIP fork
        run: cargo test --manifest-path vendor/zip/Cargo.toml

      - name: Replay security fuzz corpus
        run: cargo test -p sheetkit-core --test security_fuzz_corpus_replay

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: lcov.info
          retention-days: 7

  node:
    name: Node.js (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: development
            node-version-file: .node-version
            primary: true
          - label: minimum supported 24
            node-version: "24"
            primary: false
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-rust

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        if: matrix.primary
        run: pnpm check

      - name: Build (napi + typecheck + tsdown)
        run: pnpm --filter @sheetkit/node build

      - name: Typecheck generated declarations
        run: pnpm --filter @sheetkit/node typecheck:declarations

      - name: Test
        run: pnpm test

      - name: Build documentation
        if: matrix.primary
        run: pnpm docs:build
